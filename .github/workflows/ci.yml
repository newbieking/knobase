name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  workbench:
    name: 前端构建（tsc -b && vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  business-service:
    name: 业务服务（mvn verify）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/business-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp verify

  ai-service:
    name: AI 服务（单元测试 + 评测回归门）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-service
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      # 语料与 seed 文档、评测集必须同源，否则基线数字指向一份已不存在的文档集。
      - run: python -m eval.run_eval --check-corpus
      - name: 评测回归门
        run: |
          python -m eval.run_eval --json \
            --min docHit@5=0.80 \
            --min ndcg@10=0.75 \
            --min refusal=0.45 \
            --max falseRefusal=0.15
