spring.application.name=knobase-business
server.address=127.0.0.1
server.port=9090
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.url=jdbc:h2:file:./data/knobase;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.tomcat.max-swallow-size=100MB
knobase.ai.base-url=${KNOBASE_AI_URL:http://127.0.0.1:9001}
knobase.ai.timeout-seconds=90
knobase.seed.enabled=true
